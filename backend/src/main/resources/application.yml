server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: odysseus-backend
  
  datasource:
    # Default to H2 in-memory (PostgreSQL compatibility mode) for instant dev start,
    # or override with PostgreSQL env vars / application-pg.yml
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:odysseus_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # Default is a dev-only placeholder long enough for HS256 (needs >= 256 bits) so a
  # fresh clone boots without a WeakKeyException; override JWT_SECRET in real deployments.
  secret: ${JWT_SECRET:OdysseusSuperSecretSigningKeyForJWTAuthentication2026SecureKeyWithMinimum256Bits}
  expiration-ms: 86400000 # 24 hours
